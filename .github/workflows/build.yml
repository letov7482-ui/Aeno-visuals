name: Build Æon Vision

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Download Gradle 8.10
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle-8.10-bin.zip
          rm gradle-8.10-bin.zip
      
      - name: Build with Gradle 8.10
        run: |
          export GRADLE_HOME=$PWD/gradle-8.10
          export PATH=$GRADLE_HOME/bin:$PATH
          gradle --version
          gradle build --no-daemon
      
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ÆonVision-Build
          path: build/libs/*.jar
