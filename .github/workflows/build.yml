name: Build Æon Vision

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create release?'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Build with Gradle
        run: ./gradlew build
      
      - name: Find JAR file
        id: find-jar
        run: |
          JAR_PATH=$(ls build/libs/*.jar | grep -v sources | head -1)
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT
          echo "jar_name=$(basename $JAR_PATH)" >> $GITHUB_OUTPUT
      
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ÆonVision-${{ github.sha }}
          path: ${{ steps.find-jar.outputs.jar_path }}
      
      - name: Upload Sources Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ÆonVision-Sources-${{ github.sha }}
          path: build/libs/*-sources.jar
